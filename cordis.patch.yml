# research-tree-plugin 的 Host 组合行（bundle patch）。
# 随 profile 启动自动加载：注册 tree_node 工具、订阅 goal/subagent/workflow 事件、
# 向 Web 端暴露 researchTree 网关端点（客户端经 connection.rpc 调用）。
- insert:
    - id: research-tree
      name: 'research-tree-plugin'
      # 树数据默认存到 $DSH_HOME/research-tree/（dshHomePath 解析，不依赖服务启动目录，
      # 任何机器上行为一致）。想固定到其他目录：在本机 profile 的用户层
      # （$DSH_HOME/profiles/<profile>/cordis.patch.yml）按 id 覆盖 root，例如：
      #   - id: research-tree
      #     config:
      #       root: 'D:/your/workspace/research-vault/trees'
      config:
        root: !!js dshHomePath('research-tree')
